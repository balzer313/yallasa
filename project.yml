# XcodeGen spec. Regenerate the project with:
#   brew install xcodegen && xcodegen generate
#
# The project file is generated rather than committed because a hand-maintained
# .pbxproj is a merge-conflict machine and because this repository is authored on
# a machine without Xcode — the spec is reviewable, the generated project is not.

name: MoveIt
options:
  bundleIdPrefix: com.moveit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    OTHER_SWIFT_FLAGS: "-warn-long-function-bodies=500 -warn-long-expression-type-checking=500"
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

packages:
  MoveItKit:
    path: .

targets:
  MoveIt:
    type: application
    platform: iOS
    sources:
      - path: Sources/MoveIt
        excludes:
          - "**/.DS_Store"
      - path: Resources
        buildPhase: resources
        excludes:
          # Info.plist is consumed via INFOPLIST_FILE, which processes it into
          # the bundle itself. Leaving it in the resources phase as well makes
          # two build commands write the same path, and Xcode refuses with
          # "Multiple commands produce .../Info.plist".
          - "Info.plist"
    dependencies:
      - package: MoveItKit
        product: MoveItKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moveit.app
        PRODUCT_NAME: Move It
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # The graph files are large and are rebuilt from the network on demand,
        # so they must never be swept into an iCloud backup.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  MoveItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MoveItAppTests
    dependencies:
      - target: MoveIt
      - package: MoveItKit
        product: MoveItKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moveit.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MoveIt:
    build:
      targets:
        MoveIt: all
    run:
      config: Debug
      environmentVariables:
        - variable: MOVEIT_LOG_LEVEL
          value: debug
          isEnabled: true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MoveItTests
    profile:
      config: Release
    archive:
      config: Release

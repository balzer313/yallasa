# Builds and tests on a macOS runner.
#
# This exists because the project was authored on Windows, where the iOS SDK
# does not exist and nothing here can be compiled. GitHub's macOS runners are
# the cheapest way to close that gap: push, and within a few minutes you get a
# real compiler's opinion on 24,000 lines that have never seen one.
#
# The engine job is the one that matters first. It builds and tests YallaSaKit
# with no Xcode project, no signing and no simulator, so it is fast and it fails
# for real reasons.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine (build + test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Not `-v`. Verbose mode prints the full swift-frontend invocation for
      # every file, which buries the handful of lines that actually say
      # "error:" under megabytes of flags.
      - name: Build YallaSaKit
        run: swift build

      - name: Test YallaSaKit
        run: swift test

  app:
    name: iOS app (simulator build)
    # Newer than the engine job on purpose: Homebrew ships a current XcodeGen,
    # which writes a project format that Xcode 15.4 on macos-14 cannot open
    # ("Unable to read project"). The runner has to be at least as new as the
    # generator.
    runs-on: macos-15
    # Only worth running once the engine compiles; a broken engine fails here
    # too, with a much noisier log.
    needs: engine
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        # A simulator build needs no signing identity and no Apple Developer
        # account, which is what makes this runnable on a bare CI machine.
        #
        # Deliberately no `| xcpretty`. Piping xcodebuild into a formatter makes
        # the step's exit status the *formatter's*, and the earlier
        # `|| exit ${PIPESTATUS[0]}` guard did not survive the `||` boundary —
        # the job reported success over a build that had failed outright. A CI
        # run that lies is worse than no CI run.
        run: |
          xcodebuild build \
            -project YallaSa.xcodeproj \
            -scheme YallaSa \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # The app-layer tests have existed since the first commit and have never
      # run: this job built the app and stopped there. TripTracker's alarm
      # schedule is what makes that no longer acceptable — a rider asleep on a
      # bus is trusting those alarms completely, and an alarm a minute late is
      # an alarm at the wrong stop.
      #
      # The simulator is chosen at runtime rather than pinned to a device name,
      # because the runner image renames and renumbers its simulators with every
      # Xcode bump and a hard-coded "iPhone 15" fails the day that happens.
      - name: Test the app target
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | \
            awk '/-- iOS/{ios=1; next} /^--/{ios=0} ios && /\(.*\) \(Shutdown\)|\(.*\) \(Booted\)/ { \
              match($0, /\(([0-9A-F-]{36})\)/, m); if (m[1] != "") { print m[1]; exit } }')
          if [ -z "$DEVICE" ]; then
            echo "::error::no iOS simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project YallaSa.xcodeproj \
            -scheme YallaSa \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      # Ground truth for the localization work.
      #
      # 290 of the app's strings are plain literals whose localization key is
      # just the English text, so they can be translated from a Windows machine
      # by reading the source. The other 93 are interpolated — `Text("Leave in
      # \(x)")` — and their key carries a format specifier (%@, %lld, %.1f)
      # chosen by the type checker. Guessing those keys silently yields a string
      # that never matches at runtime and falls back to English.
      #
      # -exportLocalizations asks Xcode itself for the extracted keys and writes
      # them to an XLIFF. That is the only honest source for the remaining 93.
      - name: Export localizations
        if: always()
        continue-on-error: true
        run: |
          xcodebuild -exportLocalizations \
            -project YallaSa.xcodeproj \
            -localizationPath "$RUNNER_TEMP/loc" \
            -exportLanguage he
          find "$RUNNER_TEMP/loc" -type f | head -20

      - name: Upload the localization export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localizations
          path: |
            ${{ runner.temp }}/loc/**
            Resources/Localizable.xcstrings
          if-no-files-found: warn
          retention-days: 14

      - name: Report untranslated strings
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("Resources/Localizable.xcstrings")
          c = json.loads(p.read_text(encoding="utf-8"))
          s = c.get("strings", {})
          missing = [k for k, v in s.items()
                     if not v.get("localizations", {}).get("he", {}).get("stringUnit", {}).get("value")]
          print(f"total keys      : {len(s)}")
          print(f"translated (he) : {len(s) - len(missing)}")
          print(f"untranslated    : {len(missing)}")
          for k in sorted(missing):
              print("  -", k)
          PY
